<!DOCTYPE html>
<html
  lang="th"
  data-composition-variables='[
    {"id":"title","type":"string","label":"Episode Title","default":"Real Lens Horror"},
    {"id":"shortsMode","type":"boolean","label":"Vertical Shorts Mode","default":false},
    {"id":"shortsFraming","type":"string","label":"Shorts Framing (crop | cinema | contain)","default":"crop"},
    {"id":"hudMode","type":"string","label":"HUD Mode (survival | documentary)","default":"survival"}
  ]'
>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1920, height=1080" />
<title>Real Lens 2.5D Survival Horror (HyperFrames)</title>
<script src="assets/vendor/gsap.min.js"></script>
<style>
  @font-face {
    font-family: "Kanit";
    font-style: normal;
    font-weight: 400;
    font-display: block;
    src: url("assets/fonts/kanit-thai-400-normal.woff2") format("woff2"),
         url("assets/fonts/kanit-latin-400-normal.woff2") format("woff2");
  }
  @font-face {
    font-family: "Kanit";
    font-style: normal;
    font-weight: 500;
    font-display: block;
    src: url("assets/fonts/kanit-thai-500-normal.woff2") format("woff2"),
         url("assets/fonts/kanit-latin-500-normal.woff2") format("woff2");
  }
  @font-face {
    font-family: "Kanit";
    font-style: normal;
    font-weight: 600;
    font-display: block;
    src: url("assets/fonts/kanit-thai-600-normal.woff2") format("woff2"),
         url("assets/fonts/kanit-latin-600-normal.woff2") format("woff2");
  }
  @font-face {
    font-family: "Kanit";
    font-style: normal;
    font-weight: 700;
    font-display: block;
    src: url("assets/fonts/kanit-thai-700-normal.woff2") format("woff2"),
         url("assets/fonts/kanit-latin-700-normal.woff2") format("woff2");
  }
  @font-face {
    font-family: "Kanit";
    font-style: normal;
    font-weight: 800;
    font-display: block;
    src: url("assets/fonts/kanit-thai-800-normal.woff2") format("woff2"),
         url("assets/fonts/kanit-latin-800-normal.woff2") format("woff2");
  }
  @font-face {
    font-family: "Kanit";
    font-style: normal;
    font-weight: 900;
    font-display: block;
    src: url("assets/fonts/kanit-thai-900-normal.woff2") format("woff2"),
         url("assets/fonts/kanit-latin-900-normal.woff2") format("woff2");
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1920px;
    height: 1080px;
    background: #070A12;
    color: #FAF6EE;
    font-family: "Kanit", sans-serif;
    overflow: hidden;
    user-select: none;
  }
  #root {
    position: relative;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: #0B1320;
  }
  #stage {
    position: absolute;
    left: 0;
    top: 0;
    width: 1920px;
    height: 1080px;
    background: #0B1320;
    display: block;
    z-index: 1;
  }
</style>
</head>
<body>
<!-- HF:ROOT_START -->
<div
  id="root"
  data-composition-id="main"
  data-start="0"
  data-duration="30"
  data-width="1920"
  data-height="1080"
  data-fps="30"
>
  <canvas
    id="stage"
    class="clip"
    data-start="0"
    data-duration="30"
    data-track-index="0"
    data-layout-ignore
    data-hold
    width="1920"
    height="1080"
  ></canvas>
  <audio
    id="master-audio"
    class="clip"
    data-start="0"
    data-duration="30"
    data-track-index="1"
    data-volume="1"
    src="audio/master.wav"
  ></audio>
</div>
<!-- HF:ROOT_END -->

<script src="timeline.js"></script>
<script src="core.js"></script>
<script src="views.js"></script>
<script>
(function () {
  const TL = window.TIMELINE || { total: 30, scenes: [] };
  const cvs = document.getElementById('stage');
  const ctx = cvs.getContext('2d');
  const TOTAL = TL.total || 30;
  const SCENES = TL.scenes || [];

  const rootEl = document.getElementById('root');
  const DEFAULT_W = Number(rootEl && rootEl.getAttribute('data-width')) || 1920;
  const DEFAULT_H = Number(rootEl && rootEl.getAttribute('data-height')) || 1080;
  window.__RENDER_SCALE = DEFAULT_W / W;

  function applyBoxSize(cw, ch) {
    cvs.width = cw;
    cvs.height = ch;
    cvs.style.width = cw + 'px';
    cvs.style.height = ch + 'px';
    if (rootEl) {
      rootEl.style.width = cw + 'px';
      rootEl.style.height = ch + 'px';
    }
    document.documentElement.style.width = cw + 'px';
    document.documentElement.style.height = ch + 'px';
    document.body.style.width = cw + 'px';
    document.body.style.height = ch + 'px';
  }

  function setRenderResolution(rw, rh) {
    const cw = Math.max(320, Number(rw) || DEFAULT_W);
    const ch = Math.max(180, Number(rh) || DEFAULT_H);
    window.SHORTS_MODE = false;
    window.__RENDER_SCALE = cw / W;
    applyBoxSize(cw, ch);
  }
  window.setRenderResolution = setRenderResolution;

  function setShortsMode(enabled) {
    const on = Boolean(enabled);
    window.SHORTS_MODE = on;
    const cw = on ? 1080 : DEFAULT_W;
    const ch = on ? 1920 : DEFAULT_H;
    window.__RENDER_SCALE = on ? 1 : (cw / W);
    applyBoxSize(cw, ch);
  }
  window.setShortsMode = setShortsMode;
  function setShortsFraming(mode) {
    window.__SHORTS_FRAMING = String(mode || 'crop').toLowerCase();
  }
  window.setShortsFraming = setShortsFraming;

  // Read HyperFrames composition variables if provided (--variables / Studio panel) or query params
  if (/[?&]shorts=(?:1|true)/i.test(window.location.search)) {
    window.SHORTS_MODE = true;
  }
  const framingMatch = window.location.search.match(/[?&]framing=(cinema|contain|crop)/i);
  if (framingMatch) {
    window.__SHORTS_FRAMING = framingMatch[1].toLowerCase();
  }
  const hudMatch = window.location.search.match(/[?&]hudMode=(survival|documentary)/i);
  if (hudMatch) {
    window.HUD_MODE = hudMatch[1].toLowerCase();
  } else if (TL.hudMode) {
    window.HUD_MODE = String(TL.hudMode).toLowerCase();
  }
  if (window.__hyperframes && typeof window.__hyperframes.getVariables === 'function') {
    const vars = window.__hyperframes.getVariables() || {};
    if (typeof vars.shortsMode === 'boolean') window.SHORTS_MODE = vars.shortsMode;
    if (typeof vars.shortsFraming === 'string') window.__SHORTS_FRAMING = vars.shortsFraming.toLowerCase();
    if (vars.hudMode === 'documentary' || vars.hudMode === 'survival') window.HUD_MODE = vars.hudMode;
  }
  if (window.SHORTS_MODE) setShortsMode(true);

  function findScene(t) {
    if (SCENES.length === 0) return null;
    t = clamp(t, 0, Math.max(0, TOTAL - 0.001));
    for (let i = SCENES.length - 1; i >= 0; i--) {
      if (t >= SCENES[i].start) return SCENES[i];
    }
    return SCENES[0];
  }

  function renderAt(t) {
    t = clamp(t, 0, TOTAL);
    const s = findScene(t);
    if (!s) return;
    const lt = Math.max(0, t - s.start);
    const shorts = Boolean(window.SHORTS_MODE);
    const physW = cvs.width || (shorts ? 1080 : DEFAULT_W);
    const physH = cvs.height || (shorts ? 1920 : DEFAULT_H);
    const rs = shorts ? 1 : (physW / W);
    window.__RENDER_SCALE = rs;
    const logW = shorts ? physW : W;
    const logH = shorts ? physH : H;

    ctx.save();
    ctx.setTransform(rs, 0, 0, rs, 0, 0);
    ctx.clearRect(0, 0, logW, logH);

    const viewMap = window.VIEWS || (typeof VIEWS !== 'undefined' ? VIEWS : {});
    const fn = viewMap[s.view] || viewMap[SCENES[0].view];
    const activeHudMode = typeof getHudMode === 'function' ? getHudMode(s) : (window.HUD_MODE || TL.hudMode || 'survival');
    const storyHudEnabled = activeHudMode !== 'documentary' && Boolean(window.__ENABLE_STORY_HUD);
    const activeCard = storyHudEnabled ? (typeof normalizeCard === 'function' ? normalizeCard(s) : s.card) : null;
    const noBlurViews = window.NO_BLUR_VIEWS || [];

    let rackBlur = 0;
    if (storyHudEnabled && activeCard && !noBlurViews.includes(s.view) && activeCard.type !== 'inventory') {
      const at = activeCard.at !== undefined ? activeCard.at : 0.4;
      const ca = prog(lt, at, at + 0.45) * (1 - 0.85 * prog(lt, s.dur - 0.32, s.dur));
      rackBlur = ca * (activeCard.type === 'flow' ? 5.5 : 3.5);
    }

    const drawScene = (targetCtx) => {
      if (!fn) return;
      if (rackBlur > 0.35) {
        blurLayer(targetCtx, rackBlur, (b) => fn(b, lt, s), `brightness(${(1 - rackBlur * 0.035).toFixed(2)})`);
      } else {
        fn(targetCtx, lt, s);
      }
    };
    if (shorts && typeof renderShortsWorld === 'function') {
      renderShortsWorld(ctx, s, drawScene);
    } else {
      const worldActive = typeof beginShortsWorld === 'function' ? beginShortsWorld(ctx, s) : false;
      drawScene(ctx);
      if (typeof endShortsWorld === 'function') endShortsWorld(ctx, worldActive);
    }

    const fadeIn  = prog(lt, 0, 0.14);
    const fadeOut = 1 - prog(lt, s.dur - 0.14, s.dur);
    const edgeFade = Math.min(fadeIn, fadeOut);

    if (!window.__HIDE_HUD && activeHudMode !== 'documentary') {
      if (window.__ENABLE_STORY_TELE && typeof drawTele === 'function') drawTele(ctx, s, lt);
      if (storyHudEnabled && activeCard && typeof drawCard === 'function') drawCard(ctx, activeCard, lt, s.dur);
    }
    grain(ctx, t, 0.04);

    if (edgeFade < 1) {
      ctx.fillStyle = `rgba(10,14,22,${(1 - edgeFade) * 0.38})`;
      ctx.fillRect(0, 0, logW, logH);
    }

    if (!window.__HIDE_HUD && !window.__SHORTS_IN_BRIDGE) drawSub(ctx, s, lt);
    if (!window.__HIDE_HUD && typeof drawShortsEndingCTA === 'function') drawShortsEndingCTA(ctx, s, lt, t, TOTAL);
    ctx.restore();
  }

  // 1. Standalone Puppeteer API (audit_all_scenes.js & render_mp4.js)
  window.__setHeadless = function () { document.body.classList.add('headless', 'export-mode'); };
  window.seekTo = function (t) { renderAt(t); };
  window.renderAtTime = function (t) { renderAt(t); };
  window.__TOTAL_DURATION = TOTAL;

  // 2. Native HyperFrames Canvas Seek Protocol
  window.addEventListener('hf-seek', function (e) {
    if (e && e.detail && typeof e.detail.time === 'number') {
      renderAt(e.detail.time);
    }
  });

  // 3. Paused GSAP Root Timeline registered LAST on window.__timelines["main"]
  window.__timelines = window.__timelines || {};
  if (typeof gsap !== 'undefined') {
    const playhead = { t: 0 };
    const tl = gsap.timeline({ paused: true });
    tl.to(playhead, {
      t: TOTAL,
      duration: TOTAL,
      ease: 'none',
      onUpdate: function () { renderAt(playhead.t); }
    }, 0);
    window.__timelines['main'] = tl;
    tl.seek(0);
  }

  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(function () { renderAt(0); });
  } else {
    renderAt(0);
  }
})();
</script>
</body>
</html>
